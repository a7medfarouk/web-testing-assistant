<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Testing Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Web Testing Assistant</div>
    <nav class="steps" aria-label="Workflow">
      <button class="step active" data-view="inspect">1 · Inspect</button>
      <button class="step" disabled>2 · Test plan</button>
      <button class="step" disabled>3 · Code</button>
      <button class="step" disabled>4 · Results</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <form id="inspect-form" class="card">
        <h2>Inspect a page</h2>

        <label for="url">Page URL</label>
        <input id="url" type="url" placeholder="https://example.com/login" required>

        <label for="scope">Scope <span class="hint">optional CSS selector</span></label>
        <input id="scope" type="text" placeholder="#login-form">

        <label for="goal">Testing goal <span class="hint">optional</span></label>
        <textarea id="goal" rows="4" placeholder="e.g. Check that login rejects a wrong password"></textarea>

        <button id="inspect-btn" type="submit" class="primary">Inspect page</button>
        <p id="status" role="status"></p>
      </form>

      <section id="selection-card" class="card" hidden>
        <h2>Selection</h2>
        <p id="selection-summary" class="muted"></p>
        <button id="ask-btn" type="button" class="primary">Ask the model</button>
        <button id="clear-selection" type="button" class="link">Clear selection</button>
      </section>
    </aside>

    <section class="content">
      <div id="empty" class="card empty">
        <h2>No inspection yet</h2>
        <p class="muted">Enter a URL and run an inspection. The interactive elements found on the page will appear here.</p>
      </div>

      <div id="report" hidden>
        <div class="card page-info">
          <div>
            <div id="page-title" class="page-title"></div>
            <a id="page-url" class="page-url" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <div id="page-meta" class="muted"></div>
        </div>

        <div class="stats">
          <div class="stat"><span id="stat-total" class="num">0</span><span class="label">Elements</span></div>
          <div class="stat"><span id="stat-unique" class="num">0</span><span class="label">With a unique locator</span></div>
          <div class="stat"><span id="stat-weak" class="num">0</span><span class="label">Without one</span></div>
        </div>

        <ul id="warnings" class="warnings" hidden></ul>

        <div id="model-card" class="card model" hidden>
          <h2>Model answer</h2>
          <p id="model-answer"></p>
          <p id="model-usage" class="muted"></p>
        </div>

        <div class="card table-card">
          <div class="toolbar">
            <input id="filter" type="search" placeholder="Filter by tag, text, label or attribute">
            <span id="count" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table id="results">
              <thead>
                <tr>
                  <th class="check"><input id="select-all" type="checkbox" aria-label="Select all visible rows"></th>
                  <th>#</th>
                  <th>Element</th>
                  <th>Attributes</th>
                  <th>Locators</th>
                  <th>State</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <details class="card raw">
          <summary>Raw JSON</summary>
          <pre id="raw"></pre>
        </details>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
