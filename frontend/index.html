<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Testing Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 1.4rem; margin-bottom: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input[type=url] { flex: 2 1 320px; padding: 8px; }
    input[type=text] { flex: 1 1 200px; padding: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
    #status { min-height: 1.2em; color: #555; }
    #status.error { color: #b00020; }
    #summary { margin: 12px 0; line-height: 1.6; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    td.attrs { white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 0.8rem; }
    code { font-size: 0.8rem; word-break: break-all; }
    .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 0.75rem; margin-right: 4px; }
    .badge.ok { background: #d9f2e0; color: #11602b; }
    .badge.warn { background: #fde8c8; color: #8a4b00; }
    .none { color: #b00020; }
    pre { background: #f7f7f7; padding: 12px; overflow: auto; max-height: 400px; }
  </style>
</head>
<body>
  <h1>Web Testing Assistant</h1>

  <form id="inspect-form">
    <input id="url" type="url" placeholder="https://example.com/page" required>
    <input id="scope" type="text" placeholder="Optional CSS scope, e.g. #login-form">
    <button id="inspect-btn" type="submit">Inspect</button>
  </form>

  <p id="status"></p>
  <div id="summary"></div>

  <table id="results" hidden>
    <thead>
      <tr>
        <th>#</th><th>Tag</th><th>Text / label</th><th>Attributes</th>
        <th>Locators</th><th>State</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <details id="raw-box" hidden>
    <summary>Raw JSON</summary>
    <pre id="raw"></pre>
  </details>

  <script src="app.js"></script>
</body>
</html>
